apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: manipulative-ai-2
  labels:
    app: api
spec:
  replicas: 1
  # The SQLite volume is RWO: a rollout replaces the pod rather than running two.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: image-registry.apps.2.rahti.csc.fi/manipulative-ai-2/api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            - name: DATABASE_URL
              value: "sqlite+aiosqlite:////data/societal_discussion.db"
            - name: CORS_ORIGINS
              value: "https://vaalikeskustelu.2.rahtiapp.fi,https://admin-vaalikeskustelu.2.rahtiapp.fi,https://api-vaalikeskustelu.2.rahtiapp.fi"
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: OPENAI_API_KEY
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: ANTHROPIC_API_KEY
                  optional: true
            # GPT Lab access token for GPU-farmi-004 (provider "gptlab").
            - name: GPTLAB_API_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: GPTLAB_API_KEY
                  optional: true
            # Which provider answers: "openai", "anthropic" or "gptlab"
            # (LLM_MODEL empty = the provider's recommended model). The admin
            # panel (Settings, LLM provider) or apps/api/scripts/use_provider.sh
            # switches without a restart and takes precedence. The participant
            # pages read GET /api/provider and show that provider's texts.
            - name: LLM_PROVIDER
              value: "openai"
            - name: LLM_MODEL
              value: ""
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: ADMIN_PASSWORD
            - name: ENCRYPTION_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: ENCRYPTION_SECRET
            # Empty: no-repeat weighted random assignment across the 18
            # conditions. Comma-separated condition ids pin the traffic to
            # those conditions (uniform pick).
            - name: FORCED_PARTY
              value: ""
            # Metso, 23 October 2026: four parties, each populist and anti-populist.
            - name: ACTIVE_PARTIES
              value: "perussuomalaiset,vihreat,kokoomus,sdp"
          volumeMounts:
            - name: sqlite-data
              mountPath: /data
          # Speech is served by the speech pods (speech-deployment.yaml, path route
          # /api/speech); the same endpoints here are only a fallback.
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "700m"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: sqlite-data
          persistentVolumeClaim:
            claimName: sqlite-data
