apiVersion: apps/v1
kind: Deployment
metadata:
  name: participant
  namespace: manipulative-ai-2
  labels:
    app: participant
spec:
  replicas: 1
  # The project quota (4 CPU of limits) has no room for a second pod during
  # an update: the old pod stops before the new one starts.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: participant
  template:
    metadata:
      labels:
        app: participant
    spec:
      containers:
        - name: participant
          # Built with PUBLIC_API_URL=https://api-vaalikeskustelu.2.rahtiapp.fi
          # (inlined at build time). The provider texts follow GET /api/provider.
          image: image-registry.apps.2.rahti.csc.fi/manipulative-ai-2/participant:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              protocol: TCP
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "200m"
          readinessProbe:
            httpGet:
              path: /fi/
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /fi/
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
