apiVersion: apps/v1
kind: Deployment
metadata:
  name: speech
  namespace: manipulative-ai-2
  labels:
    app: speech
spec:
  # Speech recognition and the avatar's voice for a full lecture room: the
  # API image, run as the speech-only app (src/speech_main.py), no database.
  replicas: 1
  # The project quota (4 CPU of limits) has no room for a second pod during
  # an update: the old pod stops before the new one starts.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: speech
  template:
    metadata:
      labels:
        app: speech
    spec:
      containers:
        - name: speech
          image: image-registry.apps.2.rahti.csc.fi/manipulative-ai-2/api:latest
          imagePullPolicy: Always
          command: ["python", "-m", "uvicorn", "src.speech_main:app", "--host", "0.0.0.0", "--port", "8080", "--workers", "$(SPEECH_WORKERS)"]
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            - name: SPEECH_WORKERS
              value: "2"
            - name: SPEECH_LOCAL_WHISPER_THREADS
              value: "2"
            - name: SPEECH_WARM_UP
              value: "true"
            - name: SPEECH_CONVERSATION_CHECK_URL
              value: "http://api:8080"
            - name: CORS_ORIGINS
              value: "https://vaalikeskustelu.2.rahtiapp.fi,https://admin-vaalikeskustelu.2.rahtiapp.fi,https://api-vaalikeskustelu.2.rahtiapp.fi"
          # The project quota is 4 CPU of limits in total (CSC default):
          # participant 200m + admin 200m + API 1000m + speech 2600m.
          resources:
            requests:
              memory: "2Gi"
              cpu: "1000m"
            limits:
              memory: "6Gi"
              cpu: "2600m"
          # Ready only when every worker has loaded and run both engines.
          readinessProbe:
            httpGet:
              path: /api/speech/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 120
            periodSeconds: 20
